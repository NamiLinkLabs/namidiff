[project]
name = "namidiff"
version = "0.6.9"
description = "Efficiently diff rows across two different databases. Fork of reladiff (itself a fork of data-diff). Python package and CLI are both `namidiff`."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "NamiLink Kft.", email = "mate@namilink.com" },
    { name = "Erez Shinan", email = "erezshin@gmail.com" },
]
maintainers = [
    { name = "NamiLink Kft.", email = "mate@namilink.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = [
    "runtype>=0.5.0",
    "dsnparse",
    "click>=8.1",
    "rich",
    "toml>=0.10.2",
]

[project.urls]
Homepage = "https://github.com/NamiLinkLabs/namidiff"
Repository = "https://github.com/NamiLinkLabs/namidiff"
Documentation = "https://namidiff.namilink.com/"
"Bug Tracker" = "https://github.com/NamiLinkLabs/namidiff/issues"
"Upstream (reladiff)" = "https://github.com/erezsh/reladiff"
"Upstream (sqeleton)" = "https://github.com/erezsh/sqeleton"

[project.scripts]
namidiff = "namidiff.__main__:main"

[project.optional-dependencies]
# When adding, update also: README + the dev dependency group below
mysql = ["mysql-connector-python>=8.0.29"]
postgresql = ["psycopg2-binary"]
snowflake = ["snowflake-connector-python>=2.7.2", "cryptography"]
presto = ["presto-python-client"]
oracle = ["cx_Oracle"]
# databricks = ["databricks-sql-connector"]
trino = ["trino>=0.314.0"]
clickhouse = ["clickhouse-driver"]
vertica = ["vertica-python"]
duckdb = ["duckdb>=0.7.0"]
tui = ["textual>=0.9.1", "textual-select", "pygments>=2.13.0", "prompt-toolkit>=3.0.36"]
dremio = [
    # Published metadata points at PyPI's sqlalchemy-dremio. For local/dev installs,
    # [tool.uv.sources] below swaps in a fork that fixes datetime[ms] + Python 3.8.
    "sqlalchemy-dremio",
    "pandas>=2.1; python_version >= '3.9'",
    "pandas; python_version < '3.9'",
    "pyarrow>=18.0.0; python_version >= '3.9'",
    "pyarrow<18.0.0; python_version < '3.9'",
    "numpy>=1.26.4; python_version >= '3.9'",
    "numpy>=1.24.4; python_version < '3.9'",
]
all = [
    "mysql-connector-python>=8.0.29",
    "psycopg2-binary",
    "snowflake-connector-python>=2.7.2",
    "cryptography",
    "presto-python-client",
    "cx_Oracle",
    "trino>=0.314.0",
    "clickhouse-driver",
    "vertica-python",
    "duckdb>=0.7.0",
]

[dependency-groups]
dev = [
    "parameterized",
    "unittest-parallel",
    # "preql>=0.2.19",
    "mysql-connector-python",
    "psycopg2-binary",
    "snowflake-connector-python>=2.7.2",
    "cryptography",
    "trino>=0.314.0",
    "presto-python-client",
    "clickhouse-driver",
    "vertica-python",
    "duckdb<1.2",
    # "google-cloud-bigquery",
    # "databricks-sql-connector",
    "pandas>=2.1; python_version >= '3.9'",
    "pandas; python_version < '3.9'",
    "pyarrow>=18.0.0; python_version >= '3.9'",
    "pyarrow<18.0.0; python_version < '3.9'",
    "numpy>=1.26.4; python_version >= '3.9'",
    "numpy>=1.24.4; python_version < '3.9'",
    "sqlalchemy-dremio",
    "coverage>=7.6.1",
]

[tool.uv.sources]
# sqlalchemy-dremio 3.0.4 is missing a type conversion for datetime[ms] and is not compatible with Python 3.8.
# Fork with a fix (PR pending upstream). Only applies to uv-managed installs, not to the published wheel.
sqlalchemy-dremio = { git = "https://github.com/scottkwalker/sqlalchemy_dremio", rev = "308e686b166787941180850ce5813c313d3a9985" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["namidiff"]

[tool.hatch.build.targets.sdist]
include = ["namidiff/", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
no_implicit_optional=false

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.black]
line-length = 120
target-version = ['py38']

[tool.coverage.run]
source = ["namidiff"]
concurrency = ["thread"]
omit = [
    # Interactive / TUI tools
    "namidiff/sqeleton/repl.py",
    "namidiff/sqeleton/conn_editor.py",
    "namidiff/sqeleton/__main__.py",
    # Re-export shims
    "namidiff/databases/*.py",
    # Dialects without a local test server
    "namidiff/sqeleton/databases/snowflake.py",
    "namidiff/sqeleton/databases/bigquery.py",
    "namidiff/sqeleton/databases/redshift.py",
    "namidiff/sqeleton/databases/clickhouse.py",
    "namidiff/sqeleton/databases/trino.py",
    "namidiff/sqeleton/databases/presto.py",
    "namidiff/sqeleton/databases/databricks.py",
    "namidiff/sqeleton/databases/dremio.py",
    "namidiff/sqeleton/databases/vertica.py",
    "namidiff/sqeleton/databases/mssql.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.$",
]
