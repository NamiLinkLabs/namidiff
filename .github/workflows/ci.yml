name: CI-COVER-VERSIONS

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - '!dev/**'
      - '!docs/**'
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - '!dev/**'
      - '!docs/**'
    branches: [ main ]

  workflow_dispatch:

jobs:
  unit_tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

    name: Check Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the stack
        run: docker compose up -d --wait mysql postgres trino clickhouse presto

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install package
        run: uv sync --locked

      # BigQuery start
    #   - id: 'auth'
    #     uses: 'google-github-actions/auth@v1'
    #     with:
    #       credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

    #   - name: 'Set up BigQuery Cloud SDK'
    #     uses: 'google-github-actions/setup-gcloud@v1'

    #   - name: 'Use gcloud CLI'
    #     run: "gcloud config configurations list"

    #   - name: "Install BigQuery for Python"
    #     run: uv add google-cloud-bigquery

      # BigQuery end

      - name: Run unit tests
        env:
            # SNOWFLAKE_URI: '${{ secrets.SNOWFLAKE_URI }}'
            PRESTO_URI: 'presto://presto@127.0.0.1:8080/postgresql/public'
            TRINO_URI: 'trino://postgres@127.0.0.1:8081/postgresql/public'
            # BIGQUERY_URI: '${{ secrets.BIGQUERY_URI }}'
            CLICKHOUSE_URI: 'clickhouse://clickhouse:Password1@localhost:9000/clickhouse'
            REDSHIFT_URI: '${{ secrets.REDSHIFT_URI }}'
        run: |
          TEST_ACROSS_ALL_DBS=0 uv run unittest-parallel -j 4
