name: CI-COVER-DATABASES

on:
#   push:
#     paths:
#       - '**.py'
#       - '.github/workflows/**'
#       - '!dev/**'
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - '!dev/**'
      - '!docs/**'

    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  unit_tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.10"

    name: Check Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the stack
        run: docker compose up -d --wait mysql postgres trino presto # clickhouse

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install package
        run: uv sync --locked

      # BigQuery start
    #   - id: 'auth'
    #     uses: 'google-github-actions/auth@v1'
    #     with:
    #       credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

    #   - name: 'Set up BigQuery Cloud SDK'
    #     uses: 'google-github-actions/setup-gcloud@v1'

    #   - name: "Install BigQuery for Python"
    #     run: uv add google-cloud-bigquery

      # BigQuery end

      - name: Run unit tests
        env:
            TRINO_URI: 'trino://postgres@127.0.0.1:8081/postgresql/public'
            SNOWFLAKE_URI: '${{ secrets.SNOWFLAKE_URI }}'
            PRESTO_URI: 'presto://presto@127.0.0.1:8080/postgresql/public'
            # CLICKHOUSE_URI: 'clickhouse://clickhouse:Password1@localhost:9000/clickhouse'
            # BIGQUERY_URI: '${{ secrets.BIGQUERY_URI }}'
            REDSHIFT_URI: '${{ secrets.REDSHIFT_URI }}'
        run: |
          uv run unittest-parallel -j 4
