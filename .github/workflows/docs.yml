name: Docs

# Builds the Sphinx docs in docs/ and publishes them to GitHub Pages:
# https://namidiff.namilink.com/
# Requires repo Settings -> Pages -> Source: "GitHub Actions", Custom domain: namidiff.namilink.com
# (plus a DNS CNAME record namidiff.namilink.com -> namilinklabs.github.io). No CNAME file needed with Actions deploys.

on:
  push:
    branches: [main, fix-unit-tests]  # TODO: drop fix-unit-tests before merge (testing Pages deploy)
    paths:
      - 'docs/**'
      - 'namidiff/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'namidiff/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags since v8

      - name: Build docs
        run: uv run --with-requirements docs/requirements.txt sphinx-build -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
